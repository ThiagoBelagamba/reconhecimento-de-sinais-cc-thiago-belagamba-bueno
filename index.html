<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reconhecimento Pose - Classe 1 CINEMA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Adicionando uma fonte moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f8fafc;
      --panel-bg: #ffffff;
      --panel-border: #e2e8f0;
      --accent-color: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --bar-bg: #f1f5f9;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      margin: 0;
    }

    /* Painéis com design flat/sólido (clean) */
    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    h1, h2 {
      font-weight: 600;
      color: var(--text-main);
    }

    /* Containers de imagem e canvas mais simples */
    .webcam-wrap canvas, .result-image {
      width: 100%;
      max-width: 420px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      display: block;
      margin: 0 auto;
      background: var(--bg-color);
    }

    .result-image {
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }

    /* Botão com cor sólida e sem sombras exageradas */
    .btn-camera.btn-warning {
      background: var(--accent-color) !important;
      border: none !important;
      color: white !important;
      font-weight: 500;
      border-radius: 8px;
      padding: 0.75rem 1.5rem;
      transition: background 0.2s ease;
    }

    .btn-camera.btn-warning:hover {
      background: var(--accent-hover) !important;
    }
    
    .btn-camera.btn-warning:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Textos secundários */
    .small-muted {
      color: var(--text-muted);
    }
    .small-muted strong {
      color: var(--text-main);
      font-weight: 600;
    }

    /* Barras de progresso flat */
    #prediction-bars .progress {
      height: 12px;
      background-color: var(--bar-bg);
      border-radius: 8px;
      box-shadow: none;
      border: none;
      overflow: hidden;
    }

    #prediction-bars .progress-bar {
      background: var(--accent-color);
      font-size: 0.7rem;
      font-weight: 600;
      line-height: 12px;
    }

    #prediction-bars .d-flex span {
      font-weight: 500;
      color: var(--text-main);
      font-size: 0.85rem;
    }

    /* Destaque para a classe detectada (estilo badge clean) */
    #top-class {
      color: var(--accent-color);
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 12px;
      background: #eff6ff;
      border-radius: 6px;
      border: 1px solid #bfdbfe;
    }
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <div class="row g-4 align-items-stretch">
      <section class="col-12 col-lg-7">
        <div class="panel p-4 h-100 d-flex flex-column">
          <h1 class="h3 mb-2 text-center text-lg-start">Reconhecimento de Pose</h1>
          <p class="small-muted mb-4 text-center text-lg-start">
            Agora o gatilho principal é a <strong>Classe 1</strong>.
            Quando a Classe 1 passar do limiar, aparece o meme <strong>CINEMA</strong>.
          </p>

          <div class="d-flex justify-content-center mb-4">
            <button id="btn-init" class="btn btn-warning btn-camera">
              Iniciar câmera e reconhecimento
            </button>
          </div>

          <p id="status" class="text-center small-muted mb-4">
            Aguardando permissão da câmera.
          </p>

          <div id="webcam-container" class="webcam-wrap mb-4 flex-grow-1 d-flex align-items-center justify-content-center"></div>

          <div id="prediction-bars" class="d-grid gap-3"></div>
        </div>
      </section>

      <section class="col-12 col-lg-5">
        <div class="panel p-4 h-100 d-flex flex-column align-items-center justify-content-center text-center">
          <h2 class="h5 mb-4 text-uppercase" style="color: var(--text-muted); letter-spacing: 1px;">Resultado Principal</h2>
          
          <img
            id="result-image"
            class="result-image mb-4"
            alt="Resultado da classificação"
            src="https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=900&q=80">

          <div class="mt-auto w-100">
            <p class="mt-3 mb-2 fs-5">
              Classe detectada:<br>
              <strong id="top-class" class="d-inline-block mt-2">nenhuma</strong>
            </p>
            <p class="small-muted mb-0 mt-3 p-3" style="background: var(--bar-bg); border-radius: 8px; border: 1px solid var(--panel-border);">
              Limiar mínimo para ativar o ABSOLUTE CINEMA: <strong>80%</strong>.
            </p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
  <script>
    // Troque pela URL do seu modelo exportado no Teachable Machine.
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/J_8vy7_d1/";
    const CONFIDENCE_THRESHOLD = 0.80;
    const TARGET_CLASS_INDEX = 0; // Classe 1 no Teachable Machine.

    const DEFAULT_IMAGE = "https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=900&q=80";
    const CINEMA_IMAGE = "assets/cinema.jpg";

    let model;
    let webcam;
    let ctx;
    let canvas;
    let maxPredictions = 0;
    let barMap = {};
    let ready = false;

    const btnInit = document.getElementById("btn-init");
    const statusText = document.getElementById("status");
    const webcamContainer = document.getElementById("webcam-container");
    const predictionBars = document.getElementById("prediction-bars");
    const resultImage = document.getElementById("result-image");
    const topClass = document.getElementById("top-class");

    function setStatus(message) {
      statusText.textContent = message;
    }

    function createPredictionRows(classNames) {
      predictionBars.innerHTML = "";
      barMap = {};

      classNames.forEach((name) => {
        const row = document.createElement("div");
        row.className = "mb-2";

        const top = document.createElement("div");
        top.className = "d-flex justify-content-between mb-2";

        const label = document.createElement("span");
        label.className = "small";
        label.textContent = name;

        const value = document.createElement("span");
        value.className = "small";
        value.textContent = "0.00%";

        top.appendChild(label);
        top.appendChild(value);

        const progress = document.createElement("div");
        progress.className = "progress";
        progress.role = "progressbar";
        progress.ariaLabel = name;
        progress.ariaValuemin = "0";
        progress.ariaValuemax = "100";

        const bar = document.createElement("div");
        bar.className = "progress-bar progress-bar-striped";
        bar.style.width = "0%";
        bar.textContent = "0%";

        progress.appendChild(bar);
        row.appendChild(top);
        row.appendChild(progress);
        predictionBars.appendChild(row);

        barMap[name] = { bar, value };
      });
    }

    function updateMainImage(targetPrediction) {
      if (!targetPrediction) {
        resultImage.src = DEFAULT_IMAGE;
        topClass.textContent = "Classe 1 indisponível";
        return;
      }

      if (targetPrediction.probability >= CONFIDENCE_THRESHOLD) {
        resultImage.src = CINEMA_IMAGE;
        topClass.textContent = "CINEMA";
        return;
      }

      resultImage.src = DEFAULT_IMAGE;
      topClass.textContent = "aguardando Classe 1 > 80%";
    }

    async function init() {
      if (ready) {
        setStatus("Reconhecimento já está em execução.");
        return;
      }

      if (!MODEL_URL || MODEL_URL.includes("COLE_AQUI")) {
        setStatus("Defina a URL do modelo no código antes de iniciar.");
        return;
      }

      try {
        btnInit.disabled = true;
        setStatus("Carregando modelo...");

        const modelURL = MODEL_URL + "model.json";
        const metadataURL = MODEL_URL + "metadata.json";
        model = await tmPose.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const classNames = model.getClassLabels ? model.getClassLabels() : Array.from({ length: maxPredictions }, (_, i) => "Classe " + (i + 1));
        createPredictionRows(classNames);

        setStatus("Solicitando câmera...");
        webcam = new tmPose.Webcam(420, 320, true);
        await webcam.setup();
        await webcam.play();

        webcamContainer.innerHTML = "";
        canvas = document.createElement("canvas");
        canvas.width = 420;
        canvas.height = 320;
        ctx = canvas.getContext("2d");
        webcamContainer.appendChild(canvas);

        ready = true;
        setStatus("Reconhecimento ativo.");
        window.requestAnimationFrame(loop);
      } catch (error) {
        console.error(error);
        setStatus("Erro ao iniciar. Verifique URL do modelo e permissão da câmera.");
        btnInit.disabled = false;
      }
    }

    async function loop() {
      if (!ready) return;
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
      const prediction = await model.predict(posenetOutput);
      const targetPrediction = prediction[TARGET_CLASS_INDEX];

      for (let i = 0; i < prediction.length; i++) {
        const item = prediction[i];
        const percent = (item.probability * 100).toFixed(2);
        const refs = barMap[item.className];
        if (refs) {
          refs.value.textContent = percent + "%";
          refs.bar.style.width = percent + "%";
          refs.bar.textContent = Math.round(item.probability * 100) + "%";
          refs.bar.ariaValuenow = String(percent);
        }
      }

      updateMainImage(targetPrediction);
      drawPose(pose);
    }

    function drawPose(pose) {
      if (!ctx || !webcam || !webcam.canvas) return;
      ctx.drawImage(webcam.canvas, 0, 0);
      if (!pose) return;
      const minPartConfidence = 0.5;
      tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
      tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
    }

    btnInit.addEventListener("click", init);
  </script>
</body>
</html>
