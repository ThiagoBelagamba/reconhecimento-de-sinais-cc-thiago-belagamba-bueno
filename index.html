<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reconhecimento de Gestos - Arminha e L</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0b1020 0%, #1a2340 100%);
      color: #e9edf7;
      min-height: 100vh;
    }
    .panel {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      backdrop-filter: blur(6px);
    }
    .webcam-wrap canvas {
      width: 100%;
      max-width: 420px;
      border-radius: 14px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      display: block;
      margin: 0 auto;
    }
    .result-image {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 14px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      display: block;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.08);
    }
    .btn-camera {
      width: 100%;
      max-width: 360px;
      font-weight: 600;
      border-radius: 999px;
      padding: 0.8rem 1rem;
    }
    .small-muted {
      color: #b8c1d9;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <main class="container py-4 py-md-5">
    <div class="row g-4 align-items-stretch">
      <section class="col-12 col-lg-7">
        <div class="panel p-3 p-md-4 h-100">
          <h1 class="h3 mb-2">Reconhecimento de Gestos com Teachable Machine</h1>
          <p class="small-muted mb-4">
            Mostre sua mão para a câmera. Se detectar <strong>arminha</strong>, aparece Bolsonaro.
            Se detectar <strong>L</strong>, aparece Lula.
          </p>

          <div class="d-flex justify-content-center mb-3">
            <button id="btn-init" class="btn btn-warning btn-camera">
              Ativar câmera e iniciar reconhecimento
            </button>
          </div>

          <p id="status" class="text-center small-muted mb-3">
            Aguardando permissão da câmera.
          </p>

          <div id="webcam-container" class="webcam-wrap mb-4"></div>

          <div id="prediction-bars" class="d-grid gap-2"></div>
        </div>
      </section>

      <section class="col-12 col-lg-5">
        <div class="panel p-3 p-md-4 h-100">
          <h2 class="h5 mb-3">Resultado principal</h2>
          <img
            id="result-image"
            class="result-image"
            alt="Resultado da classificação"
            src="https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=900&q=80">

          <p class="mt-3 mb-1">
            Classe detectada:
            <strong id="top-class">nenhuma</strong>
          </p>
          <p class="small-muted mb-0">
            Limiar mínimo para troca de imagem: <strong>80%</strong>.
          </p>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
  <script>
    // Troque pela URL do seu modelo exportado no Teachable Machine.
    const MODEL_URL = "COLE_AQUI_A_URL_DO_SEU_MODELO/";
    const CONFIDENCE_THRESHOLD = 0.80;

    // URLs públicas das imagens solicitadas.
    const IMAGE_BY_CLASS = {
      arminha: "https://upload.wikimedia.org/wikipedia/commons/2/24/Jair_Bolsonaro_2019_Portrait.jpg",
      l: "https://upload.wikimedia.org/wikipedia/commons/2/2c/Lula_in_2023.jpg",
      default: "https://images.unsplash.com/photo-1557683316-973673baf926?auto=format&fit=crop&w=900&q=80"
    };

    let model;
    let webcam;
    let maxPredictions = 0;
    let barMap = {};
    let ready = false;

    const btnInit = document.getElementById("btn-init");
    const statusText = document.getElementById("status");
    const webcamContainer = document.getElementById("webcam-container");
    const predictionBars = document.getElementById("prediction-bars");
    const resultImage = document.getElementById("result-image");
    const topClass = document.getElementById("top-class");

    function normalizeClassName(className) {
      return className.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
    }

    function setStatus(message) {
      statusText.textContent = message;
    }

    function createPredictionRows(classNames) {
      predictionBars.innerHTML = "";
      barMap = {};

      classNames.forEach((name) => {
        const row = document.createElement("div");
        row.className = "mb-2";

        const top = document.createElement("div");
        top.className = "d-flex justify-content-between mb-1";

        const label = document.createElement("span");
        label.className = "small";
        label.textContent = name;

        const value = document.createElement("span");
        value.className = "small";
        value.textContent = "0.00%";

        top.appendChild(label);
        top.appendChild(value);

        const progress = document.createElement("div");
        progress.className = "progress";
        progress.role = "progressbar";
        progress.ariaLabel = name;
        progress.ariaValuemin = "0";
        progress.ariaValuemax = "100";

        const bar = document.createElement("div");
        bar.className = "progress-bar progress-bar-striped";
        bar.style.width = "0%";
        bar.textContent = "0%";

        progress.appendChild(bar);
        row.appendChild(top);
        row.appendChild(progress);
        predictionBars.appendChild(row);

        barMap[name] = { bar, value };
      });
    }

    function updateMainImage(className, probability) {
      const normalized = normalizeClassName(className);
      if (probability < CONFIDENCE_THRESHOLD) {
        resultImage.src = IMAGE_BY_CLASS.default;
        topClass.textContent = "incerto (abaixo de 80%)";
        return;
      }

      if (normalized === "arminha") {
        resultImage.src = IMAGE_BY_CLASS.arminha;
        topClass.textContent = "arminha";
        return;
      }

      if (normalized === "l") {
        resultImage.src = IMAGE_BY_CLASS.l;
        topClass.textContent = "L";
        return;
      }

      resultImage.src = IMAGE_BY_CLASS.default;
      topClass.textContent = className;
    }

    async function init() {
      if (ready) {
        setStatus("Reconhecimento já está em execução.");
        return;
      }

      if (!MODEL_URL || MODEL_URL.includes("COLE_AQUI")) {
        setStatus("Defina a URL do modelo no código antes de iniciar.");
        return;
      }

      try {
        btnInit.disabled = true;
        setStatus("Carregando modelo...");

        const modelURL = MODEL_URL + "model.json";
        const metadataURL = MODEL_URL + "metadata.json";
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const classNames = model.getClassLabels();
        createPredictionRows(classNames);

        setStatus("Solicitando câmera...");
        webcam = new tmImage.Webcam(420, 320, true);
        await webcam.setup();
        await webcam.play();

        webcamContainer.innerHTML = "";
        webcamContainer.appendChild(webcam.canvas);

        ready = true;
        setStatus("Reconhecimento ativo.");
        window.requestAnimationFrame(loop);
      } catch (error) {
        console.error(error);
        setStatus("Erro ao iniciar. Verifique URL do modelo e permissão da câmera.");
        btnInit.disabled = false;
      }
    }

    async function loop() {
      if (!ready) return;
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);

      let best = prediction[0];
      for (let i = 0; i < prediction.length; i++) {
        const item = prediction[i];
        if (item.probability > best.probability) best = item;

        const percent = (item.probability * 100).toFixed(2);
        const refs = barMap[item.className];
        if (refs) {
          refs.value.textContent = percent + "%";
          refs.bar.style.width = percent + "%";
          refs.bar.textContent = Math.round(item.probability * 100) + "%";
          refs.bar.ariaValuenow = String(percent);
        }
      }

      updateMainImage(best.className, best.probability);
    }

    btnInit.addEventListener("click", init);
  </script>
</body>
</html>
